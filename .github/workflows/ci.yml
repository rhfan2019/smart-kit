name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Type check (strict)
        run: npm run typecheck
      - name: Lint, tokens, trademark
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Traceability
        run: npm run trace -- --strict
      - name: Build and bundle size
        run: |
          npm run build
          npm run size
      - name: Storybook build
        run: npm run build-storybook
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (axe, screenshots, performance)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
