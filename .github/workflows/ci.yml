name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PostgreSQL for the purchasing service of apps/pg-server (smart-kit-server, ADR-027): conformance and CLI tests,
    # and the end-to-end tests against it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMART_KIT_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SMART_KIT_DB_PASSWORD: smart_kit_ci
      SMART_KIT_DATABASE_URL: postgresql://smart_kit_app:smart_kit_ci@localhost:5432/smart_kit_purchasing
      SMART_KIT_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check (strict)
        run: npm run typecheck
      - name: Lint, tokens, trademark
        run: npm run lint
      - name: PostgreSQL test database (roles, database, tables, data)
        run: npm run pg:setup
      - name: Generated CSDL is up to date and the annotations still match
        run: |
          npm run pg:generate -- --strict
          git diff --exit-code -- apps/pg-server/generated
      - name: Unit tests (incl. conformance with fe-mockserver)
        run: npm test
      # SAPUI5 api.json files are downloaded from ui5.sap.com into .cache/ui5 (never committed, ADR-033 §9)
      - name: Cache SAPUI5 api.json (alignment checks)
        uses: actions/cache@v4
        with:
          path: .cache/ui5
          key: ui5-1.154.0-${{ hashFiles('scripts/ui5/api-cache.mjs') }}
      - name: API alignment with SAPUI5 1.154 (docs/30 §7.1)
        run: npm run check:ui5
      - name: Build and bundle size
        run: |
          npm run build
          npm run size
      - name: Agent docs are up to date (ADR-030)
        run: node scripts/gen-agent-docs.mjs --check
      - name: Packed tarballs install and work in fresh projects (ADR-029)
        run: npm run verify:pack
      - name: Storybook build
        run: npm run build-storybook
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (axe, screenshots, performance)
        run: npm run e2e
      # a real Fiori elements app (SAPUI5 loaded from ui5.sap.com at runtime) against the same test service (docs/30 §7.2)
      - name: Comparison with Fiori elements 1.154 (AL-10..AL-12, AL-21)
        run: npm run e2e:fe
      - name: End-to-end tests against PostgreSQL (smart-kit-server)
        run: npm run e2e:pg
      # needs the unit and end-to-end results (reports/*.json), so it runs after both
      - name: Traceability
        run: npm run trace -- --strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            tests/e2e/__screenshots__/linux/
