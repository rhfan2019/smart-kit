name: CI

# Jobs run in parallel (D31): static checks, unit tests and builds in one job; the end-to-end suites in shards, each
# shard with its own test services; the traceability check merges the shard reports at the end.
# The end-to-end jobs (e2e, e2e PostgreSQL, the comparison with Fiori elements) are skipped (D50) for
# - version commits of the release ("chore: version packages", its pull request and its merge): they only change
#   versions and changelogs, the same code was tested when it was pushed;
# - commits that only change documentation (docs/, *.md, .changeset/).
# Branches `ci/*` run the same checks without releasing (release.yml only follows main): push work in progress there
# to see it on GitHub's runners early (D50).
on:
  push:
    branches: [main, 'ci/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # a new push to a pull request replaces the running check; on main every commit is checked
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # whether the end-to-end jobs run (see the top of this file)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.files.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          HEAD_REF: ${{ github.head_ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$HEAD_REF" = "changeset-release/main" ] || [[ "$MESSAGE" == "chore: version packages"* ]] || [[ "$MESSAGE" == *"/changeset-release/main"* ]]; then
            echo "version commit: no end-to-end tests"; echo "e2e=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no base commit: all tests"; echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BEFORE" HEAD | grep -Ev '^docs/|\.md$|^\.changeset/' || true)
          if [ -z "$code" ]; then echo "documentation only: no end-to-end tests"; echo "e2e=false" >> "$GITHUB_OUTPUT"
          else echo "$code" | head -20; echo "e2e=true" >> "$GITHUB_OUTPUT"; fi

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL for the purchasing service of apps/pg-server (smart-kit-server, ADR-027): conformance and CLI tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMART_KIT_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SMART_KIT_DB_PASSWORD: smart_kit_ci
      SMART_KIT_DATABASE_URL: postgresql://smart_kit_app:smart_kit_ci@localhost:5432/smart_kit_purchasing
      SMART_KIT_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check (strict)
        run: npm run typecheck
      - name: Lint, tokens, trademark
        run: npm run lint
      - name: PostgreSQL test database (roles, database, tables, data)
        run: npm run pg:setup
      - name: Generated CSDL is up to date and the annotations still match
        run: |
          npm run pg:generate -- --strict
          git diff --exit-code -- apps/pg-server/generated
      - name: Unit tests (incl. conformance with fe-mockserver)
        run: npm test
      # SAPUI5 api.json files are downloaded from ui5.sap.com into .cache/ui5 (never committed, ADR-033 §9)
      - name: Cache SAPUI5 api.json (alignment checks)
        uses: actions/cache@v4
        with:
          path: .cache/ui5
          key: ui5-1.154.0-${{ hashFiles('scripts/ui5/api-cache.mjs') }}
      - name: API alignment with SAPUI5 1.154 (docs/30 §7.1)
        run: npm run check:ui5
      - name: Build and bundle size
        run: |
          npm run build
          npm run size
      - name: Agent docs are up to date (ADR-030)
        run: node scripts/gen-agent-docs.mjs --check
      - name: Packed tarballs install and work in fresh projects (ADR-029)
        run: npm run verify:pack
      - name: Storybook build
        run: npm run build-storybook
      # the traceability job reads the unit results
      - uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: reports/unit-results.json
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (axe, screenshots, performance)
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            test-results/
            tests/e2e/__screenshots__/linux/

  e2e-pg:
    name: e2e PostgreSQL (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMART_KIT_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SMART_KIT_DB_PASSWORD: smart_kit_ci
      SMART_KIT_DATABASE_URL: postgresql://smart_kit_app:smart_kit_ci@localhost:5432/smart_kit_purchasing
      SMART_KIT_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PostgreSQL test database (roles, database, tables, data)
        run: npm run pg:setup
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against PostgreSQL (smart-kit-server)
        run: npm run e2e:pg -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-pg-report-${{ matrix.shard }}
          path: test-results/

  # a real Fiori elements app (SAPUI5 loaded from ui5.sap.com at runtime) against the same test service (docs/30 §7.2)
  e2e-fe:
    name: Comparison with Fiori elements 1.154 (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Comparison with Fiori elements 1.154 (AL-10..AL-12, AL-21)
        run: npm run e2e:fe -- --shard=${{ matrix.shard }}/4
      # the traceability job merges the shards' results (docs/32 appendix, F rows)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fe-blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fe-report-${{ matrix.shard }}
          path: |
            test-results/
            reports/fe-compare/

  # needs the unit and end-to-end results (docs/13: every criterion maps to a passing test)
  traceability:
    needs: [checks, e2e, e2e-fe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: unit-results
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        run: npx playwright merge-reports --reporter json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e-results.json
      - uses: actions/download-artifact@v4
        with:
          pattern: fe-blob-report-*
          path: all-fe-blob-reports
          merge-multiple: true
      - name: Merge the comparison shard reports
        run: npx playwright merge-reports --reporter json all-fe-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e-fe-results.json
      - name: Traceability
        run: npm run trace -- --strict
