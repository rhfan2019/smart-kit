name: Release

# ADR-029. Runs after CI succeeded on main (so a red build never publishes):
# - unreleased changesets on main  -> opens / updates the "chore: version packages" pull request
#   (bumps the four packages together, writes their CHANGELOG.md);
# - that pull request merged       -> publishes every package whose version is not on npm yet, with npm trusted
#   publishing (OIDC, provenance, no token), then installs the published versions from npm and checks them.
# Needs, once: a trusted publisher on npmjs.com for each package (repository rhfan2019/smart-kit, workflow
# release.yml) and "Allow GitHub Actions to create and approve pull requests" in the repository settings.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # manual re-run, e.g. after configuring the trusted publishers
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Version pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a new version takes a few minutes to become installable from npm
      # changesets 3 prints its results in a format changesets/action does not parse, so its `published` output stays
      # false (D50): after a publish run (no changesets left) push the version tags `changeset publish` created and
      # check whatever is now on npm (versions that were already there pass at once)
      - name: Push the version tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push origin --tags
      - name: Install the published packages from npm and check them
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          for i in $(seq 1 20); do
            node scripts/verify-pack.mjs --registry && exit 0
            echo "not installable yet, retrying in 30 s ($i/20)"; sleep 30
          done
          exit 1
